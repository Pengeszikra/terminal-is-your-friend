<!-- Coded by OpenAI Codex. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <meta name="description" content="A small TypeScript terminal with the pipeline operator and an isolated JavaScript sandbox.">
  <title>Terminal Is Your Friend</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/main.js"></script>
</head>
<body class="bg-[#101411] text-[#d6e0d7] min-h-dvh font-mono antialiased">
  <main class="mx-auto flex h-dvh max-w-6xl flex-col px-4 sm:px-8">
    <header class="flex shrink-0 select-none flex-wrap items-center justify-between gap-3 border-b border-[#2b352d] py-5 sm:py-7">
      <h1 class="text-base font-semibold tracking-tight sm:text-lg"><span class="text-[#95d4a4]">|&gt;</span> Terminal Is Your Friend</h1>
      <div class="flex items-center gap-5 text-sm">
        <button id="clear" type="button" class="text-[#a9b6ac] hover:text-white focus-visible:outline-2 focus-visible:outline-[#95d4a4]">Clear</button>
        <button id="reset" type="button" class="text-[#a9b6ac] hover:text-white focus-visible:outline-2 focus-visible:outline-[#95d4a4]">Reset session</button>
      </div>
    </header>
    <div id="program-screen" aria-label="Program screen" tabindex="0" hidden></div>
    <section id="terminal" tabindex="0" aria-label="TypeScript terminal" class="min-h-0 flex-1 overflow-y-auto py-6 sm:py-8">
      <div id="output" role="log" aria-live="polite" aria-relevant="additions" class="space-y-3"></div>
      <div id="editor-row" class="mt-5 grid grid-cols-[1.5rem_minmax(0,1fr)] items-start gap-2">
        <span aria-hidden="true" class="select-none pt-1 text-[#95d4a4]">❯</span>
        <div class="editor">
          <pre id="highlight" aria-hidden="true"><code id="highlight-code"></code></pre>
          <textarea id="input" aria-label="TypeScript code" rows="2" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="40 + 2" disabled></textarea>
        </div>
      </div>
    </section>
    <footer class="flex shrink-0 select-none flex-wrap items-center justify-between gap-2 border-t border-[#2b352d] py-4 text-xs text-[#8f9e92] sm:text-sm">
      <span><kbd>Enter</kbd> run <span class="mx-2 text-[#455348]">/</span> <kbd>Shift Enter</kbd> new line <span class="mx-2 text-[#455348]">/</span> <kbd>↑ ↓</kbd> history <span class="mx-2 text-[#455348]">/</span> <kbd>//</kbd> ask instructor <span class="mx-2 text-[#455348]">/</span> <kbd>Ctrl L</kbd> clear</span>
      <span id="status" role="status">Starting sandbox…</span>
    </footer>
  </main>
</body>
</html>
